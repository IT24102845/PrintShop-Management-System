<header class="top-nav">

  <!-- Page breadcrumb / hamburger -->
  <div class="topnav-left">
    <button class="hamburger" (click)="toggleSidebar()" title="Toggle Sidebar" aria-label="Toggle Sidebar">
      <span class="material-icons-outlined">menu</span>
    </button>
  </div>

  <!-- All Pages Navigation Bar -->
  <nav class="topnav-nav" aria-label="Primary Navigation">
    <div class="topnav-links">
      @for (item of visibleNavItems(); track item.route) {
        <a [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.route === '/app/dashboard' }"
           class="topnav-link"
           [title]="item.label">
          <span class="material-icons-outlined topnav-link-icon">{{ item.icon }}</span>
          <span class="topnav-link-text">{{ item.label }}</span>
        </a>
      }
    </div>
  </nav>

  <!-- Right side -->
  <div class="topnav-right">

    <!-- Theme Toggle -->
    <button
      class="theme-toggle"
      (click)="themeService.toggle()"
      [title]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      [attr.aria-label]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      [class.is-dark]="themeService.isDark()"
      id="theme-toggle-btn">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <span class="material-icons-outlined theme-icon theme-icon-moon">dark_mode</span>
          <span class="material-icons-outlined theme-icon theme-icon-sun">light_mode</span>
        </span>
      </span>
    </button>

    <!-- Profile Menu -->
    <div class="profile-wrapper">
      <button class="profile-btn" (click)="toggleProfile()">
        <div class="profile-avatar">
          {{ userInitials() }}
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ user()?.full_name || user()?.email }}</span>
          <span class="profile-role">{{ userRole() }}</span>
        </div>
        <span class="material-icons-outlined profile-chevron">expand_more</span>
      </button>

      @if (showProfileMenu()) {
        <div class="profile-dropdown">
          <div class="dropdown-header">
            <div class="profile-avatar lg">
              {{ userInitials() }}
            </div>
            <div>
              <p class="dropdown-name">{{ user()?.full_name || 'User' }}</p>
              <p class="dropdown-email">{{ user()?.email }}</p>
              <span class="badge badge-primary" style="margin-top:0.375rem">{{ userRole() }}</span>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item" (click)="goToCustomerPortal()">
            <span class="material-icons-outlined">storefront</span> Customer Portal
          </button>
          <button class="dropdown-item danger" (click)="logout()">
            <span class="material-icons-outlined">logout</span> Sign Out
          </button>
        </div>
      }
    </div>

  </div>
</header>
